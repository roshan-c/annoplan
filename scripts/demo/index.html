<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>annoplan demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(circle at 18% 22%, #f5b38a 0, transparent 42%),
          radial-gradient(circle at 82% 18%, #9db8f2 0, transparent 46%),
          radial-gradient(circle at 70% 88%, #c7a6e8 0, transparent 48%),
          radial-gradient(circle at 12% 90%, #8fd0c9 0, transparent 40%),
          #e9dfe8;
        display: grid;
        place-items: center;
      }
      .window {
        position: relative;
        width: 1180px;
        height: 720px;
        border-radius: 12px;
        /* clip, not hidden: scrollIntoView would scroll a hidden box. */
        overflow: clip;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.25),
          0 24px 64px rgba(40, 20, 60, 0.32);
        isolation: isolate;
      }
      /* Stands in for the window's behind-window vibrancy. */
      .window::before {
        content: "";
        position: absolute;
        inset: -60px;
        background: inherit;
        background-image:
          radial-gradient(circle at 10% 20%, #f2c4a8 0, transparent 50%),
          radial-gradient(circle at 20% 80%, #b9d6e6 0, transparent 55%),
          #ece6ec;
        filter: blur(30px) saturate(1.3);
        z-index: -1;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: transparent;
      }
      .lights {
        position: absolute;
        left: 18px;
        top: 14px;
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="window">
      <iframe src="app.html" title="annoplan" allowtransparency="true"></iframe>
      <div class="lights">
        <i style="background: #ff5f57"></i><i style="background: #febc2e"></i
        ><i style="background: #28c840"></i>
      </div>
    </div>
  </body>
</html>
